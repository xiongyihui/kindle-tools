<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>婴儿黑白视觉训练卡 (50 张)</title>
<style>
  /* 电子墨水屏: 纯白/纯黑背景, 无灰度渐变; 图形用 currentColor, 挖空用 var(--bg) */
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  .card {
    width: 758px; height: 1024px;
    overflow: hidden; box-sizing: border-box; position: relative;
    background: #FFFFFF; color: #000000; --bg: #FFFFFF;
  }
  .card.dark { background: #000000; color: #FFFFFF; --bg: #000000; }
  .card svg { display: block; width: 758px; height: 1024px; }
  /* 底部中文卡名: 基线 y=946, 42px 中黑体, 宽字距; x 补偿半个字距保持光学居中 */
  .label {
    font-family: "PingFang SC","STHeiti Medium","STHeiti","Hiragino Sans GB",sans-serif;
    font-size: 42px; font-weight: 500; letter-spacing: 14px;
    fill: currentColor; /* 黑底卡上标注翻白 */
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// 婴儿黑白视觉训练卡 — 50 张, 758×1024, 纯黑白, 电子墨水屏适用
// 用法: flashcards.html          → 纵向显示全部 50 张 (调试)
//       flashcards.html?n=3     → 只显示第 3 张 (供无头 Chrome 截图)
// 设计系统:
//   图形光学中心 (CX=379, GY=464), 图形主体 ≤560px, 墨迹须留在
//   安全区 x∈[80,678] y∈[64,880] 内 (标注带 900 以下不得侵入);
//   四大分组: 1-16 几何启蒙 / 17-28 天地自然 / 29-40 动物朋友 / 41-50 生活物件;
//   11 张黑底卡(白图)穿插, 任何两张黑底卡不相邻。
// ============================================================
const CX = 379, GY = 464;

// ---- 几何辅助 ------------------------------------------------
// 五角星顶点 (外径 R 内径 r, 默认尖朝上)
function starPts(cx, cy, R, r, rot = -90) {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const rad = (i % 2 === 0) ? R : r;
    const a = (rot + i * 36) * Math.PI / 180;
    p.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
}
// 太阳光芒: n 道, 从 r1 到 r2, 圆头
function sunRays(cx, cy, r1, r2, n) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = i * 360 / n * Math.PI / 180;
    s += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy + r1 * Math.sin(a)).toFixed(1)}"
              x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy + r2 * Math.sin(a)).toFixed(1)}"
              stroke="currentColor" stroke-width="42" stroke-linecap="round"/>`;
  }
  return s;
}
// 小花 6 瓣: 花瓣椭圆绕中心旋转
function petals(cx, cy) {
  let s = '';
  for (let k = 0; k < 6; k++) {
    s += `<ellipse cx="${cx}" cy="${cy - 148}" rx="64" ry="102" transform="rotate(${k * 60} ${cx} ${cy})"/>`;
  }
  return s;
}
// n×n 棋盘 (左上角为黑)
function checker(x0, y0, cell, n) {
  let s = '';
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if ((r + c) % 2 === 0)
        s += `<rect x="${x0 + c * cell}" y="${y0 + r * cell}" width="${cell}" height="${cell}"/>`;
  return s;
}
// 网格: n×n 格, 含外框
function grid(x0, y0, size, n, sw) {
  let s = '';
  const cell = size / n;
  for (let i = 0; i <= n; i++) {
    const x = x0 + i * cell, y = y0 + i * cell;
    s += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0 + size}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="square"/>`;
    s += `<line x1="${x0}" y1="${y}" x2="${x0 + size}" y2="${y}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="square"/>`;
  }
  return s;
}
// 条纹: size 内 2n 条带 (n 条填色), horiz=横向
function stripes(x0, y0, size, n, horiz) {
  let s = '';
  const band = size / (2 * n);
  for (let i = 0; i < n; i++) {
    const off = band / 2 + i * 2 * band; // 两侧留半带, 填色组对称居中
    s += horiz
      ? `<rect x="${x0}" y="${y0 + off}" width="${size}" height="${band}"/>`
      : `<rect x="${x0 + off}" y="${y0}" width="${band}" height="${size}"/>`;
  }
  return s;
}
// 阿基米德螺旋路径
function spiralPath(cx, cy, turns, rMax, stepDeg = 6) {
  const a = rMax / (turns * 2 * Math.PI);
  let d = '';
  for (let t = 0; t <= turns * 360; t += stepDeg) {
    const th = t * Math.PI / 180, r = a * th;
    d += (t === 0 ? 'M' : 'L') + ' ' + (cx + r * Math.cos(th)).toFixed(1) + ' ' + (cy + r * Math.sin(th)).toFixed(1) + ' ';
  }
  return d;
}
// 放射轮: n 等分扇形, 隔一填一
function sectors(cx, cy, r, n) {
  let s = '';
  for (let k = 0; k < n; k += 2) {
    const a1 = (-90 + k * 360 / n) * Math.PI / 180, a2 = (-90 + (k + 1) * 360 / n) * Math.PI / 180;
    s += `<path d="M ${cx} ${cy} L ${(cx + r * Math.cos(a1)).toFixed(1)} ${(cy + r * Math.sin(a1)).toFixed(1)}
                   A ${r} ${r} 0 0 1 ${(cx + r * Math.cos(a2)).toFixed(1)} ${(cy + r * Math.sin(a2)).toFixed(1)} Z"/>`;
  }
  return s;
}
// 锯齿带: x0..x1, 半周期数须为偶数保证两端同相位
function zigzag(x0, x1, y, amp, period, sw) {
  const half = period / 2;
  let p = '';
  for (let x = x0, i = 0; x <= x1; x += half, i++)
    p += (p ? ' ' : '') + x + ',' + (i % 2 === 0 ? y - amp : y + amp);
  return `<polyline points="${p}" fill="none" stroke="currentColor" stroke-width="${sw}"
           stroke-linejoin="miter" stroke-linecap="square"/>`;
}
// 雪花: 6 主臂 + 中段 ±45° 分枝 + 中心圆
function snowflake(cx, cy) {
  let s = '';
  for (let k = 0; k < 6; k++) {
    const a = k * 60 * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
    s += `<line x1="${(cx + 44 * ux).toFixed(1)}" y1="${(cy + 44 * uy).toFixed(1)}"
               x2="${(cx + 252 * ux).toFixed(1)}" y2="${(cy + 252 * uy).toFixed(1)}"
               stroke="currentColor" stroke-width="28" stroke-linecap="round"/>`;
    for (const sgn of [1, -1]) {
      const bx = cx + 158 * ux, by = cy + 158 * uy;
      const ba = Math.atan2(uy, ux) + sgn * Math.PI / 4;
      s += `<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}"
                 x2="${(bx + 78 * Math.cos(ba)).toFixed(1)}" y2="${(by + 78 * Math.sin(ba)).toFixed(1)}"
                 stroke="currentColor" stroke-width="20" stroke-linecap="round"/>`;
    }
  }
  s += `<circle cx="${cx}" cy="${cy}" r="34"/>`;
  return s;
}
// 风车叶 (局部坐标, 指向右上, 旋转 4 份)
function pinwheel(cx, cy) {
  const blade = 'M 0 -26 C 10 -104 54 -190 132 -228 C 158 -164 138 -84 66 -40 C 44 -26 16 -24 0 -26 Z';
  let s = `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="734" stroke="currentColor" stroke-width="20" stroke-linecap="round"/>`;
  for (let k = 0; k < 4; k++)
    s += `<path d="${blade}" transform="translate(${cx} ${cy}) rotate(${k * 90})"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="20" fill="var(--bg)"/>`;
  return s;
}
// 刺猬: 尖刺拱背 + 尖吻 + 腹线 + 短腿
function hedgehog(cx, cy) {
  const valleys = [172, 148, 124, 100, 76, 52, 28, 4];
  let d = `M 118 640 `;
  for (let i = 0; i < valleys.length - 1; i++) {
    const v1 = valleys[i] * Math.PI / 180, mid = (valleys[i] + valleys[i + 1]) / 2 * Math.PI / 180;
    d += `L ${(cx + 168 * Math.cos(v1)).toFixed(1)} ${(cy - 168 * Math.sin(v1)).toFixed(1)} `;
    d += `L ${(cx + 250 * Math.cos(mid)).toFixed(1)} ${(cy - 250 * Math.sin(mid)).toFixed(1)} `;
  }
  const vEnd = 4 * Math.PI / 180;
  d += `L ${(cx + 168 * Math.cos(vEnd)).toFixed(1)} ${(cy - 168 * Math.sin(vEnd)).toFixed(1)} `;
  d += `L ${cx + 172} ${cy + 4} L ${cx - 232} ${cy + 4} Z`;
  let s = `<path d="${d}" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/>`;
  s += `<rect x="${cx - 110}" y="${cy + 2}" width="56" height="56" rx="16"/>
        <rect x="${cx + 46}" y="${cy + 2}" width="56" height="56" rx="16"/>
        <circle cx="196" cy="566" r="12" fill="var(--bg)"/>`;
  return s;
}
// 圆角多边形: fill + 同色 round join 粗描边
function roundPoly(points, sw) {
  return `<polygon points="${points}" stroke="currentColor" stroke-width="${sw}" stroke-linejoin="round"/>`;
}

// 黑底白图卡 (1-based 序号): 任何两张不相邻

// ---- 渲染: ?n=N 只显示第 N 张; 无参数显示全部 (调试) ----
function cardSvg(name, art, dark) {
  return `<svg viewBox="0 0 758 1024" width="758" height="1024" xmlns="http://www.w3.org/2000/svg">
<g fill="currentColor" stroke="none">
${art}
</g>
<text class="label" x="${CX + 7}" y="946" text-anchor="middle">${name}</text>
</svg>`;
}

const params = new URLSearchParams(location.search);
const n = parseInt(params.get('n') || '0', 10);
const app = document.getElementById('app');
if (n >= 1 && n <= ART.length) {
  document.title = `卡 ${n} · ${NAMES[n - 1]}`;
  app.innerHTML = `<div class="card${DARK.has(n) ? ' dark' : ''}">${cardSvg(NAMES[n - 1], ART[n - 1], DARK.has(n))}</div>`;
} else {
  app.innerHTML = ART.map((a, i) =>
    `<div class="card${DARK.has(i + 1) ? ' dark' : ''}">${cardSvg(NAMES[i], a, DARK.has(i + 1))}</div>`).join('\n');
}
